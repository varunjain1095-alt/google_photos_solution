<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Scroll Journey: AI Powered Wayfinder</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100vh;}}::-webkit-scrollbar{display:none;}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}.no-scrollbar::-webkit-scrollbar{display:none;}.rp-cases{position:fixed;top:14px;left:14px;z-index:999;font:600 12px system-ui;color:#334155;background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:7px 13px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.08);display:inline-flex;align-items:center;gap:5px}.rp-cases:hover{background:#f1f5f9}@media (min-width:1090px){.rp-cases{top:20px;left:20px}}</style>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">tailwind.config={theme:{extend:{colors:{surface:"#f8f9fa","surface-variant":"#e1e3e4",outline:"#727785","surface-container":"#edeeef","on-primary":"#ffffff","on-surface":"#191c1d","on-secondary-fixed-variant":"#005320","on-secondary-fixed":"#002108",primary:"#005bbf","surface-container-highest":"#e1e3e4","on-secondary":"#ffffff","on-primary-fixed":"#001a41","inverse-on-surface":"#f0f1f2","on-primary-fixed-variant":"#004493","surface-container-low":"#f3f4f5","secondary-fixed":"#89fa9b","inverse-surface":"#2e3132","on-surface-variant":"#414754","secondary":"#006e2c","surface-container-lowest":"#ffffff","primary-container":"#1a73e8","primary-fixed":"#d8e2ff","primary-fixed-dim":"#adc7ff","tertiary-fixed":"#e8deff","on-tertiary-fixed":"#20005f","tertiary":"#6833ea",secondary_container:"#86f898","on-secondary-container":"#00722f",background:"#f8f9fa","on-background":"#191c1d","outline-variant":"#c1c6d6"},borderRadius:{DEFAULT:"1rem",lg:"2rem",xl:"3rem",full:"9999px"},spacing:{margin:"1rem","space-sm":"0.5rem","space-xs":"0.25rem","space-lg":"1.5rem","space-md":"1rem","space-xl":"2rem"},fontFamily:{"headline-lg-mobile":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"title-lg":["Plus Jakarta Sans"],"body-md":["Roboto Flex"],"body-sm":["Roboto Flex"],"label-md":["Roboto Flex"],"label-lg":["Roboto Flex"],"display-lg-mobile":["Plus Jakarta Sans"]}}}}</script>
<style>
  /* Depth cues: years far from the focal band blur and dim; the focal year sharpens */
  .year-row { transition: filter .25s ease, opacity .25s ease, transform .25s ease; }
  .year-marker { transition: all .3s ease; }
  .year-marker.marker-near { transform: scale(1.35); }
  .year-marker.marker-candidate-near {
    transform: scale(1.6);
    box-shadow: 0 0 14px 3px rgba(0,110,44,.55);
    background: #006e2c !important;
  }
  .year-marker.marker-candidate-idle { background: #86f898; }
  .flash-chip { opacity: 0; transform: translateY(8px); transition: opacity .35s ease, transform .35s ease; }
  .flash-chip.flash-on { opacity: 1; transform: translateY(0); }
  .candidate-banner { opacity: 0; transition: opacity .35s ease; }
  .candidate-banner.banner-on { opacity: 1; }
</style>
<style>/* Phone frame: cap the app at mobile width on wide viewports */@media (min-width:480px){html{background:#e8eaed}body{max-width:430px !important;margin:0 auto !important;box-shadow:0 0 48px rgba(0,0,0,0.14);min-height:100vh}.fixed{left:0 !important;right:0 !important;max-width:430px !important;margin-inline:auto !important}}</style></head>
<body class="bg-surface font-body-md text-on-surface">
<a class="rp-cases" href="index.html">&larr; All cases</a>
<div class="max-w-[430px] mx-auto h-screen flex flex-col relative overflow-hidden">
<!-- Header -->
<header class="shrink-0 pt-4 pb-2 px-4 bg-surface/95 backdrop-blur-md z-30 border-b border-surface-container">
<div class="flex items-center gap-2">
<button aria-label="Back" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-surface-container" onclick="history.back()">
<span class="material-symbols-outlined text-[22px]">arrow_back</span>
</button>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings:'FILL' 1;">travel_explore</span>
<span class="font-label-lg text-xs font-semibold text-primary uppercase tracking-wider">Scroll Journey</span>
</div>
<h1 class="font-headline-lg-mobile text-xl font-bold tracking-tight">Ride the timeline</h1>
</div>
</div>
<p class="font-body-sm text-xs text-on-surface-variant mt-1">Scroll down to move back through the years. Candidate years sharpen and glow as you approach.</p>
</header>
<!-- Right rail: year markers -->
<div class="absolute right-3 top-0 bottom-0 z-20 flex flex-col justify-center gap-2.5 pointer-events-none" id="year-rail"></div>
<!-- Scrollable timeline -->
<div class="flex-1 overflow-y-auto no-scrollbar relative" id="timeline">
<div class="h-[30vh]"></div>
<!-- Year rows injected by JS -->
<div id="year-rows" class="flex flex-col"></div>
<div class="h-[30vh]"></div>
</div>
</div>
<script>
// Scroll Journey — standalone exploratory feature.
// Depth cues: distance from the focal band controls blur/opacity (fast pass = smeared,
// approach = sharpening). Candidate markers glow before arrival. Ambient flashes
// surface cross-product context (Gmail/Calendar/Maps) as the scroll passes their year.
var YEARS = [
  { year: 2024, label: "This year", count: "1,204 photos", candidate: false,
    flashes: [{ icon: "location_on", text: "Moved apartments (Maps Timeline)" }] },
  { year: 2023, label: "Diwali 2023", count: "842 photos", candidate: true, link: "kyoto_recurring/wayfinding.html",
    flashes: [
      { icon: "mail", text: "Kyoto hotel booking (Gmail cross-ref)" },
      { icon: "event", text: "Autumn break block (Calendar)" }
    ] },
  { year: 2022, label: "Kyoto & Tokyo", count: "1,560 photos", candidate: true, link: "kyoto/wayfinding.html",
    flashes: [
      { icon: "mail", text: "Flight confirmations (Gmail cross-ref)" },
      { icon: "location_on", text: "Two weeks in Japan (Maps Timeline)" }
    ] },
  { year: 2021, label: "", count: "986 photos", candidate: false,
    flashes: [{ icon: "location_on", text: "The year you moved to Pune (Maps Timeline)" }] },
  { year: 2020, label: "", count: "640 photos", candidate: false, flashes: [] },
  { year: 2019, label: "", count: "1,890 photos", candidate: false,
    flashes: [{ icon: "event", text: "Goa trip with college crew (Calendar)" }] },
  { year: 2018, label: "", count: "1,230 photos", candidate: false, flashes: [] },
  { year: 2017, label: "", count: "980 photos", candidate: false, flashes: [] },
  { year: 2016, label: "", count: "720 photos", candidate: false, flashes: [] },
  { year: 2015, label: "", count: "410 photos", candidate: false, flashes: [] }
];

var rowsEl = document.getElementById('year-rows');
var railEl = document.getElementById('year-rail');
var timeline = document.getElementById('timeline');

// Build year rows + rail markers
YEARS.forEach(function (y, i) {
  var row = document.createElement('div');
  row.className = 'year-row min-h-[62vh] flex flex-col justify-center px-6 pr-16';
  row.id = 'yr-' + y.year;
  var inner = '<span class="font-display-lg-mobile text-5xl font-bold tracking-tight ' +
    (y.candidate ? 'text-secondary' : 'text-on-surface') + '">' + y.year + '</span>' +
    '<span class="font-body-md text-sm text-on-surface-variant mt-1">' +
    (y.label ? y.label + ' · ' : '') + y.count + '</span>';
  if (y.candidate) {
    inner += '<div class="candidate-banner mt-3 flex items-center gap-2">' +
      '<span class="w-2.5 h-2.5 rounded-full bg-secondary animate-pulse"></span>' +
      '<span class="font-label-md text-xs font-bold text-secondary uppercase tracking-wider">Candidate space</span>' +
      '</div>' +
      '<a href="' + y.link + '" class="candidate-banner mt-3 inline-flex items-center gap-1.5 self-start px-4 h-10 rounded-full bg-primary text-on-primary text-sm font-semibold shadow-sm">' +
      '<span>Open this space</span><span class="material-symbols-outlined text-[17px]">arrow_forward</span></a>';
  }
  if (y.flashes.length) {
    inner += '<div class="flex flex-col gap-1.5 mt-3">';
    y.flashes.forEach(function (f) {
      inner += '<div class="flash-chip inline-flex items-center gap-1.5 self-start px-3 py-1.5 rounded-full bg-surface-container-highest text-on-surface-variant text-[11px] font-medium shadow-xs">' +
        '<span class="material-symbols-outlined text-[14px] text-primary">' + f.icon + '</span><span>' + f.text + '</span></div>';
    });
    inner += '</div>';
  }
  row.innerHTML = inner;
  rowsEl.appendChild(row);

  var marker = document.createElement('div');
  marker.className = 'year-marker w-2 h-2 rounded-full bg-outline-variant' + (y.candidate ? ' marker-candidate-idle' : '');
  marker.id = 'mk-' + y.year;
  marker.title = String(y.year);
  railEl.appendChild(marker);
});

var rows = Array.prototype.slice.call(rowsEl.children);

function update() {
  var mid = timeline.scrollTop + timeline.clientHeight / 2;
  rows.forEach(function (row, i) {
    var y = YEARS[i];
    var center = row.offsetTop + row.offsetHeight / 2;
    var d = Math.abs(center - mid) / (row.offsetHeight / 2); // 0 = centered, ~1 = one row away
    var focus = Math.max(0, 1 - Math.min(d, 2.2) / 2.2);      // 1 at center → 0 far away
    var blur = (1 - focus) * (y.candidate ? 3 : 6);
    var opacity = y.candidate ? 0.45 + focus * 0.55 : 0.22 + focus * 0.78;
    row.style.filter = 'blur(' + blur.toFixed(1) + 'px)';
    row.style.opacity = opacity.toFixed(2);
    row.style.transform = 'scale(' + (0.96 + focus * 0.05).toFixed(3) + ')';

    var marker = document.getElementById('mk-' + y.year);
    marker.classList.toggle('marker-near', focus > 0.55 && !y.candidate);
    marker.classList.toggle('marker-candidate-near', y.candidate && focus > 0.35);

    // Ambient flashes + candidate banner appear as the year nears the focal band
    row.querySelectorAll('.flash-chip').forEach(function (chip) {
      chip.classList.toggle('flash-on', focus > 0.45);
    });
    row.querySelectorAll('.candidate-banner').forEach(function (b) {
      b.classList.toggle('banner-on', focus > 0.55);
    });
  });
}

timeline.addEventListener('scroll', update, { passive: true });
window.addEventListener('resize', update);
update();
</script>
</body></html>
